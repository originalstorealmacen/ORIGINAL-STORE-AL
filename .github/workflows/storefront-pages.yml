name: Original Store · catálogo rápido
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Preparar tienda conectada a Drive
        shell: bash
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.ico' -o -name '*.woff*' -o -name CNAME \) ! -iname '*private*' ! -name 'catalog-photo-*' ! -name 'original-store-image-cache.js' -exec cp -t _site {} +
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar Original Store
        id: deployment
        uses: actions/deploy-pages@v4
